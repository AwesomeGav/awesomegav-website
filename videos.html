<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos - AwesomeGav Gaming Channel</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#ffffff;
    color:#333;
}
.container{max-width:1200px;margin:auto;padding:0 20px}
header{
    position:sticky;top:0;z-index:1000;
    background:#fff;
    box-shadow:0 2px 20px rgba(0,0,0,.04)
}
nav{display:flex;justify-content:space-between;align-items:center;padding:1.4rem 0}
.logo{display:flex;align-items:center;gap:1rem;text-decoration:none}
.logo img{width:48px;height:48px;border-radius:10px;background:#333;padding:5px}
.logo span{font-size:1.8rem;font-weight:800;color:#333}
.nav-links{list-style:none;display:flex;gap:2rem}
.nav-links a{text-decoration:none;color:#333;font-weight:500}
.nav-links a:hover{color:#777}

.videos-header{text-align:center;padding:4rem 0 2rem}
.videos-header h1{font-size:3rem}
.videos-header p{color:#666;margin-top:.5rem}

.video-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:2rem;
    padding:2rem 0 5rem
}
.video-card{
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
    transition:.3s
}
.video-card:hover{transform:translateY(-6px)}
.thumb{
    position:relative;
    width:100%;
    padding-bottom:56.25%;
    background:#eee;
    cursor:pointer
}
.thumb img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover
}
.play{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:60px;height:60px;
    background:rgba(0,0,0,.75);
    border-radius:50%;
}
.play:after{
    content:"";
    position:absolute;
    top:50%;left:50%;
    transform:translate(-40%,-50%);
    border-left:18px solid #fff;
    border-top:12px solid transparent;
    border-bottom:12px solid transparent
}
.video-info{padding:1.2rem}
.video-info h3{
    font-size:1.05rem;
    line-height:1.4;
    margin-bottom:.4rem;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden
}
.date{font-size:.85rem;color:#999;margin-bottom:.8rem}
.actions{display:flex;gap:.6rem}
.actions a,.actions button{
    padding:.45rem 1rem;
    border-radius:20px;
    font-size:.85rem;
    border:none;
    cursor:pointer;
    text-decoration:none;
    color:#333;
    background:#eee
}
.actions a{background:#fff;border:1px solid #ddd}
.actions a:hover,.actions button:hover{background:#ddd}

.loading{text-align:center;padding:4rem;color:#666;font-size:1.2rem}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    z-index:2000;
    align-items:center;
    justify-content:center
}
.modal.active{display:flex}
.modal-content{width:90%;max-width:1000px;position:relative}
.close{
    position:absolute;top:-40px;right:0;
    background:#fff;border:none;
    width:36px;height:36px;
    border-radius:50%;
    font-size:1.5rem;cursor:pointer
}
.player{position:relative;padding-bottom:56.25%}
.player iframe{
    position:absolute;
    width:100%;height:100%
}

footer{
    background:#f5f5f5;
    padding:3rem;
    text-align:center
}

/* Hamburger Menu */
.hamburger{display:none;flex-direction:column;cursor:pointer;gap:5px}
.hamburger span{width:28px;height:3px;background:#333;border-radius:3px;transition:all .3s}
.hamburger.active span:nth-child(1){transform:rotate(45deg) translate(8px,8px)}
.hamburger.active span:nth-child(2){opacity:0}
.hamburger.active span:nth-child(3){transform:rotate(-45deg) translate(7px,-7px)}

/* Close button inside mobile menu */
.nav-close{display:none;position:absolute;top:1.5rem;right:1.5rem;width:40px;height:40px;background:none;border:none;cursor:pointer;padding:0;z-index:1002}
.nav-close span{display:block;width:28px;height:3px;background:#333;border-radius:3px;position:absolute;top:50%;left:50%}
.nav-close span:nth-child(1){transform:translate(-50%,-50%) rotate(45deg)}
.nav-close span:nth-child(2){transform:translate(-50%,-50%) rotate(-45deg)}

#auth-button{background:#e0e0e0;border:none;padding:0.4rem 0.9rem;border-radius:50px;cursor:pointer;font-weight:600;color:#333;transition:all .3s;display:flex;align-items:center;gap:0.4rem;font-size:0.9rem;height:36px;min-width:100px}
#auth-button:hover{background:#d0d0d0;transform:translateY(-2px)}

@media(max-width:768px){
    .hamburger{display:flex;z-index:1001}
    .nav-close{display:block}
    .nav-links{position:fixed;top:0;right:-100%;width:280px;height:100vh;background:#fff;flex-direction:column;padding:2rem;padding-top:5rem;gap:1.5rem;box-shadow:-2px 0 20px rgba(0,0,0,.1);transition:right .3s;z-index:999}
    .nav-links.active{right:0}
    .nav-links a{font-size:1.1rem}
    .videos-header h1{font-size:2.2rem}
    .video-grid{grid-template-columns:1fr}
    .logo span{font-size:1.5rem}
    .logo img{width:40px;height:40px}
}
    .video-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<nav class="container">
<a class="logo" href="index">
<img src="logo.jpg" alt="AwesomeGav Logo">
<span>AwesomeGav</span>
</a>
<div class="hamburger" id="hamburger"><span></span><span></span><span></span></div><ul class="nav-links" id="nav-links">
<button class="nav-close" id="nav-close" aria-label="Close menu">
<span></span>
<span></span>
</button>
<li><a href="index">Home</a></li>
<li><a href="videos">Videos</a></li>
<li><a href="games">Games</a></li>
<li><a href="guides">Guides</a></li>
<li><button id="auth-button">🔐 Sign In</button></li>
</ul>
</nav>
</header>

<section class="videos-header">
<div class="container">
<h1>Latest Videos</h1>
<p>Automatically updated from YouTube</p>
</div>
</section>

<main class="container">
<div id="loading" class="loading">Loading videos...</div>
<div id="videos" class="video-grid"></div>
</main>

<div id="modal" class="modal">
<div class="modal-content">
<button class="close" onclick="closeModal()">×</button>
<div class="player">
<iframe id="player" allowfullscreen></iframe>
</div>
</div>
</div>

<footer>
<p>© 2025 AwesomeGav Gaming Channel</p>
</footer>

<script>
const CHANNEL_ID = "UC7UHCo3gVT6CzpaYcDJfWVw";
const grid = document.getElementById("videos");
const loading = document.getElementById("loading");

fetch(`https://api.rss2json.com/v1/api.json?rss_url=https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}`)
.then(res => res.json())
.then(data => {
    loading.style.display = "none";
    data.items.forEach(item => {
        const videoId = item.guid.replace("yt:video:", "");
        const date = new Date(item.pubDate).toLocaleDateString();

        const card = document.createElement("div");
        card.className = "video-card";
        card.innerHTML = `
            <div class="thumb" onclick="play('${videoId}')">
                <img src="https://i.ytimg.com/vi/${videoId}/hqdefault.jpg">
                <div class="play"></div>
            </div>
            <div class="video-info">
                <h3>${item.title}</h3>
                <div class="date">${date}</div>
                <div class="actions">
                    <button onclick="play('${videoId}')">Watch Here</button>
                    <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank">YouTube</a>
                </div>
            </div>
        `;
        grid.appendChild(card);
    });
})
.catch(() => {
    loading.innerHTML = "Failed to load videos.";
});

function play(id){
    document.getElementById("player").src =
        `https://www.youtube.com/embed/${id}?autoplay=1`;
    document.getElementById("modal").classList.add("active");
}
function closeModal(){
    document.getElementById("player").src = "";
    document.getElementById("modal").classList.remove("active");
}
</script>

<script>
const hamburger=document.getElementById('hamburger');
const navLinks=document.getElementById('nav-links');
const navClose=document.getElementById('nav-close');
hamburger.addEventListener('click',()=>{hamburger.classList.toggle('active');navLinks.classList.toggle('active')});
if(navClose){navClose.addEventListener('click',()=>{hamburger.classList.remove('active');navLinks.classList.remove('active')})}
navLinks.querySelectorAll('a').forEach(link=>{link.addEventListener('click',()=>{hamburger.classList.remove('active');navLinks.classList.remove('active')})});
document.addEventListener('click',(e)=>{if(!hamburger.contains(e.target)&&!navLinks.contains(e.target)){hamburger.classList.remove('active');navLinks.classList.remove('active')}});
</script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<!-- Firebase Config -->
<script src="firebase-config.js"></script>
<script src="auth.js"></script>

<script>
// Initialize Firebase Auth for videos.html
try {
    firebase.initializeApp(firebaseConfig);
    initAuth();
} catch (error) {
    console.warn('Firebase auth not configured:', error);
    // Hide auth button if Firebase is not configured
    const authButton = document.getElementById('auth-button');
    if (authButton) {
        authButton.style.display = 'none';
    }
}
</script>
</body>
</html>
