<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos - AwesomeGav Gaming Channel</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#ffffff;
    color:#333;
}
.container{max-width:1200px;margin:auto;padding:0 20px}
header{
    position:sticky;top:0;z-index:1000;
    background:#fff;
    box-shadow:0 2px 20px rgba(0,0,0,.04)
}
nav{display:flex;justify-content:space-between;align-items:center;padding:1.4rem 0}
.logo{display:flex;align-items:center;gap:1rem;text-decoration:none}
.logo img{width:48px;height:48px;border-radius:10px;background:#333;padding:5px}
.logo span{font-size:1.8rem;font-weight:800;color:#333}
.nav-links{list-style:none;display:flex;gap:2rem}
.nav-links a{text-decoration:none;color:#333;font-weight:500}
.nav-links a:hover{color:#777}

.videos-header{text-align:center;padding:4rem 0 2rem}
.videos-header h1{font-size:3rem}
.videos-header p{color:#666;margin-top:.5rem}

.video-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:2rem;
    padding:2rem 0 5rem
}
.video-card{
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
    transition:.3s
}
.video-card:hover{transform:translateY(-6px)}
.thumb{
    position:relative;
    width:100%;
    padding-bottom:56.25%;
    background:#eee;
    cursor:pointer
}
.thumb img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover
}
.play{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:60px;height:60px;
    background:rgba(0,0,0,.75);
    border-radius:50%;
}
.play:after{
    content:"";
    position:absolute;
    top:50%;left:50%;
    transform:translate(-40%,-50%);
    border-left:18px solid #fff;
    border-top:12px solid transparent;
    border-bottom:12px solid transparent
}
.video-info{padding:1.2rem}
.video-info h3{
    font-size:1.05rem;
    line-height:1.4;
    margin-bottom:.4rem;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden
}
.date{font-size:.85rem;color:#999;margin-bottom:.8rem}
.actions{display:flex;gap:.6rem}
.actions a,.actions button{
    padding:.45rem 1rem;
    border-radius:20px;
    font-size:.85rem;
    border:none;
    cursor:pointer;
    text-decoration:none;
    color:#333;
    background:#eee
}
.actions a{background:#fff;border:1px solid #ddd}
.actions a:hover,.actions button:hover{background:#ddd}

.loading{text-align:center;padding:4rem;color:#666;font-size:1.2rem}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    z-index:2000;
    align-items:center;
    justify-content:center
}
.modal.active{display:flex}
.modal-content{width:90%;max-width:1000px;position:relative}
.close{
    position:absolute;top:-40px;right:0;
    background:#fff;border:none;
    width:36px;height:36px;
    border-radius:50%;
    font-size:1.5rem;cursor:pointer
}
.player{position:relative;padding-bottom:56.25%}
.player iframe{
    position:absolute;
    width:100%;height:100%
}

footer{
    background:#f5f5f5;
    padding:3rem;
    text-align:center
}

@media(max-width:768px){
    .videos-header h1{font-size:2.2rem}
    .video-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<nav class="container">
<a class="logo" href="index.html">
<img src="logo.jpg" alt="AwesomeGav Logo">
<span>AwesomeGav</span>
</a>
<ul class="nav-links">
<li><a href="index.html">Home</a></li>
<li><a href="videos.html">Videos</a></li>
<li><a href="games.html">Games</a></li>
<li><a href="guides.html">Guides</a></li>
</ul>
</nav>
</header>

<section class="videos-header">
<div class="container">
<h1>Latest Videos</h1>
<p>Automatically updated from YouTube</p>
</div>
</section>

<main class="container">
<div id="loading" class="loading">Loading videos...</div>
<div id="videos" class="video-grid"></div>
</main>

<div id="modal" class="modal">
<div class="modal-content">
<button class="close" onclick="closeModal()">×</button>
<div class="player">
<iframe id="player" allowfullscreen></iframe>
</div>
</div>
</div>

<footer>
<p>© 2025 AwesomeGav Gaming Channel</p>
</footer>

<script>
const CHANNEL_ID = "UC7UHCo3gVT6CzpaYcDJfWVw";
const grid = document.getElementById("videos");
const loading = document.getElementById("loading");

fetch(`https://api.rss2json.com/v1/api.json?rss_url=https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}`)
.then(res => res.json())
.then(data => {
    loading.style.display = "none";
    data.items.forEach(item => {
        const videoId = item.guid.replace("yt:video:", "");
        const date = new Date(item.pubDate).toLocaleDateString();

        const card = document.createElement("div");
        card.className = "video-card";
        card.innerHTML = `
            <div class="thumb" onclick="play('${videoId}')">
                <img src="https://i.ytimg.com/vi/${videoId}/hqdefault.jpg">
                <div class="play"></div>
            </div>
            <div class="video-info">
                <h3>${item.title}</h3>
                <div class="date">${date}</div>
                <div class="actions">
                    <button onclick="play('${videoId}')">Watch Here</button>
                    <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank">YouTube</a>
                </div>
            </div>
        `;
        grid.appendChild(card);
    });
})
.catch(() => {
    loading.innerHTML = "Failed to load videos.";
});

function play(id){
    document.getElementById("player").src =
        `https://www.youtube.com/embed/${id}?autoplay=1`;
    document.getElementById("modal").classList.add("active");
}
function closeModal(){
    document.getElementById("player").src = "";
    document.getElementById("modal").classList.remove("active");
}
</script>

</body>
</html>
